services:
  yada-node:
    image: ghcr.io/pdxwebdev/yadacoin:latest
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
    volumes:
      - ./config:/app/config
    ports:
      - "8000:8000"
      - "8001:8001"
      - "3333:3333"
      - "3334:3334"
    depends_on:
      - mongodb
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/yadacoin
      - PYTHONUNBUFFERED=1
      - MOTOR_MAX_WORKERS=1
      - PYTHONPATH=/app
    logging:
      driver: json-file
      options:
        max-size: "200k"
        max-file: "10"

  mongodb:
    image: mongo:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    command: --wiredTigerCacheSizeGB .25
    logging:
      driver: json-file
      options:
        max-size: "200k"
        max-file: "10"

  updater:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 3600 --label-enable --cleanup

  restore:
    image: mongo:latest
    profiles: ["restore"]
    restart: "no"
    depends_on:
      - mongodb
    volumes:
      - ./dump:/dump
      - ./strip-block-indexes.sh:/strip-block-indexes.sh:ro
    command: sh -c 'apt-get update && apt-get install -y jq && sh /strip-block-indexes.sh /dump/yadacoin/blocks.metadata.json && mongorestore --drop --host mongodb /dump'

  backup:
    image: mongo:latest
    profiles: ["backup"]
    restart: "no"
    depends_on:
      - mongodb
    volumes:
      - .:/work
    working_dir: /work
    command: sh -c 'apt-get update && apt-get install -y jq && mongodump --host mongodb --db=yadacoin --collection=blocks && sh strip-block-indexes.sh dump/yadacoin/blocks.metadata.json && tar -czvf bootstrap.tar.gz dump'

volumes:
  mongodb_data:
