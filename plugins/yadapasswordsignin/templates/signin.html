<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{{ title }}</title>
  <style>
    html, body { margin: 0; background: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    header { background: #010409; border-bottom: 1px solid #30363d; padding: 12px 24px; font-weight: 600; }
    main { max-width: 560px; margin: 80px auto; padding: 0 24px; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 28px; }
    button, a.btn { display: inline-block; margin: 8px 8px 0 0; background: #238636; color: #fff; text-decoration: none; font-weight: 600; padding: 8px 14px; border-radius: 6px; border: 0; cursor: pointer; font: inherit; }
    button.secondary, a.btn.secondary { background: #21262d; border: 1px solid #30363d; }
    p { color: #8b949e; line-height: 1.5; }
    label { display: block; margin-top: 16px; font-size: 13px; font-weight: 700; color: #c9d1d9; }
    input {
      width: 100%;
      box-sizing: border-box;
      margin-top: 6px;
      border: 1px solid #30363d;
      border-radius: 6px;
      background: #0d1117;
      color: #c9d1d9;
      font: inherit;
      font-size: 16px;
      padding: 8px 12px;
    }
    input:disabled, input[readonly] { opacity: 0.85; cursor: default; }
    .err { color: #f85149; margin-top: 8px; }
    .ok { color: #3fb950; margin-top: 8px; }
    .busy { color: #d29922; margin-top: 8px; }
    .busy::before {
      content: "";
      display: inline-block;
      width: 12px;
      height: 12px;
      margin-right: 8px;
      border: 2px solid #30363d;
      border-top-color: #d29922;
      border-radius: 50%;
      vertical-align: -2px;
      animation: yada-spin 0.8s linear infinite;
    }
    .track { display: none; height: 3px; margin-top: 16px; background: #21262d; border-radius: 99px; overflow: hidden; }
    .track.on { display: block; }
    .track > span {
      display: block;
      height: 100%;
      width: 35%;
      background: #d29922;
      animation: yada-slide 1.1s ease-in-out infinite;
    }
    button:disabled { opacity: 0.55; cursor: default; }
    @keyframes yada-spin { to { transform: rotate(360deg); } }
    @keyframes yada-slide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }
    code { color: #c9d1d9; }
  </style>
</head>
<body>
  <header>{{ header }}</header>
  <main>
    <div class="card">
      <h1>Sign in with Yada Password</h1>
      <p>{{ blurb }}</p>
      <p id="extStatus">Sign in sends a request. Approve it in the Yada Password extension or the Android/iOS app.</p>
      <label for="signinUsername">Yada username</label>
      <input id="signinUsername" type="text" autocomplete="username" spellcheck="false" readonly value="{{ username }}" />
      <p>
        <button type="button" id="signinBtn">Sign in</button>
        <button type="button" id="registerBtn" disabled>Register this origin</button>
        <button type="button" id="resyncBtn" disabled>Resync</button>
        <a class="btn secondary" href="/password-rotation">Extension harness</a>
      </p>
      <div id="msg" role="status" aria-live="polite"></div>
      <div id="track" class="track" aria-hidden="true"><span></span></div>
    </div>
  </main>
  <script>
    const NEXT = {% raw next_json %};
    const KEYNAME = {% raw keyname_json %};
    const origin = window.location.origin.toLowerCase();
    const USERNAME_KEY = "yada-password-username";
    let extReady = false;
    let reqSeq = 0;
    const $msg = document.getElementById("msg");
    const $st = document.getElementById("extStatus");
    const $track = document.getElementById("track");
    const $user = document.getElementById("signinUsername");
    const SIGNIN_LABEL = "Sign in";
    const REGISTER_LABEL = "Register this origin";
    const RESYNC_LABEL = "Resync";
    let working = false;
    let activeRequestId = "";
    let progressTimer = null;
    let progressStarted = 0;
    let progressLabel = "";
    let signinAbort = null;

    window.addEventListener("message", (event) => {
      if (event.source !== window) return;
      if (event.data && event.data.type === "YADA_PASSWORD_READY") {
        extReady = true;
        $st.textContent = "Extension ready.";
        $st.className = "ok";
        setButtonsLocked(working);
      }
      if (
        event.data &&
        event.data.type === "YADA_PASSWORD_PROGRESS" &&
        event.data.requestId === activeRequestId &&
        event.data.message
      ) {
        showProgress(String(event.data.message));
      }
    });
    setTimeout(() => {
      if (!extReady) {
        $st.textContent = "Sign in does not need the extension on this page. Approve the request in the Yada Password extension or the Android/iOS app. Register and Resync still use the extension.";
        $st.className = "";
      }
    }, 1500);

    function extRequest(type, resultType, timeoutMs = 180000) {
      const requestId = "r" + ++reqSeq + "_" + Date.now();
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => {
          window.removeEventListener("message", onMsg);
          reject(new Error("extension did not respond"));
        }, timeoutMs);
        function onMsg(event) {
          if (event.source !== window) return;
          const d = event.data;
          if (!d || d.type !== resultType || d.requestId !== requestId) return;
          clearTimeout(timer);
          window.removeEventListener("message", onMsg);
          resolve(d);
        }
        window.addEventListener("message", onMsg);
        activeRequestId = requestId;
        window.postMessage({ type, requestId }, "*");
      });
    }
    function setMsg(text, kind) {
      $msg.textContent = text || "";
      $msg.className = kind || "";
    }
    function setButtonsLocked(locked) {
      const extOff = locked || !extReady;
      document.getElementById("registerBtn").disabled = extOff;
      document.getElementById("resyncBtn").disabled = extOff;
      document.getElementById("signinBtn").disabled = locked;
      if ($user) $user.readOnly = true;
    }
    function showProgress(label) {
      progressLabel = label;
      const secs = progressStarted
        ? Math.floor((Date.now() - progressStarted) / 1000)
        : 0;
      setMsg(label + (secs > 0 ? " · " + secs + "s" : ""), "busy");
      $track.className = "track on";
    }
    function startProgress(label) {
      stopProgress();
      working = true;
      progressStarted = Date.now();
      setButtonsLocked(true);
      showProgress(label);
      progressTimer = setInterval(() => showProgress(progressLabel), 1000);
    }
    function stopProgress() {
      if (progressTimer) clearInterval(progressTimer);
      progressTimer = null;
      progressStarted = 0;
      progressLabel = "";
      working = false;
      activeRequestId = "";
      $track.className = "track";
      setButtonsLocked(false);
    }
    function stashOperatorToken(token) {
      if (!token) return;
      try {
        sessionStorage.setItem("yadaOperatorToken", token);
      } catch (e) {}
      if (KEYNAME && KEYNAME.indexOf("operator-") === 0) {
        try {
          localStorage.setItem("operator-jwt-" + KEYNAME, token);
        } catch (e) {}
      }
    }
    function rememberUsername(name) {
      try {
        sessionStorage.setItem(USERNAME_KEY, name);
      } catch (e) {}
    }
    function currentUsername() {
      return (($user && $user.value) || "").trim().replace(/^@/, "");
    }
    async function loadUsername() {
      if (!$user) return;
      try {
        const saved = sessionStorage.getItem(USERNAME_KEY) || "";
        if (saved && !$user.value) $user.value = saved;
      } catch (e) {}
      if ($user.value) return;
      try {
        const res = await fetch("/yada-config", {
          headers: { Accept: "application/json" },
          credentials: "include",
        });
        const data = await res.json().catch(() => ({}));
        const name = (
          (data && data.identity && data.identity.username) ||
          ""
        )
          .trim()
          .replace(/^@/, "");
        if (name && !$user.value) $user.value = name;
      } catch (e) {}
    }
    function sleep(ms, signal) {
      return new Promise((resolve, reject) => {
        const timer = setTimeout(resolve, ms);
        if (!signal) return;
        const onAbort = () => {
          clearTimeout(timer);
          reject(new DOMException("cancelled", "AbortError"));
        };
        if (signal.aborted) {
          onAbort();
          return;
        }
        signal.addEventListener("abort", onAbort, { once: true });
      });
    }
    async function expectedSigninHash(signal) {
      try {
        const tipRes = await fetch(
          "/password-rotation/offchain/tip?branch_peer=" +
            encodeURIComponent(origin),
          { headers: { Accept: "application/json" }, credentials: "include", signal }
        );
        const tipData = await tipRes.json();
        const pre =
          tipData &&
          tipData.tip &&
          tipData.tip.password &&
          tipData.tip.password.prerotated_password_hash;
        return pre || undefined;
      } catch (e) {
        return undefined;
      }
    }
    function authPollBase(created) {
      const home = String((created && created.home_node) || "").replace(/\/+$/, "");
      if (created && created.proxied && home) return home;
      return "";
    }
    async function fetchAuthView(sessionId, base, signal) {
      const root = String(base || "").replace(/\/+$/, "");
      const url =
        root +
        "/password-rotation/auth-session/" +
        encodeURIComponent(sessionId);
      const res = await fetch(url, {
        headers: { Accept: "application/json" },
        credentials: root && root !== origin ? "omit" : "include",
        signal,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok && res.status !== 404) {
        throw new Error(data.message || "poll failed (" + res.status + ")");
      }
      return data;
    }
    async function waitForAuthApproval(sessionId, created, signal) {
      const remote = authPollBase(created);
      const started = Date.now();
      while (!signal.aborted) {
        if (Date.now() - started > 180000) {
          throw new Error("timed out waiting for approval");
        }
        await sleep(1500, signal);
        let view = null;
        if (remote) {
          try {
            view = await fetchAuthView(sessionId, remote, signal);
          } catch (err) {
            if (err && err.name === "AbortError") throw err;
            view = null;
          }
        }
        let localView = null;
        try {
          localView = await fetchAuthView(sessionId, "", signal);
        } catch (err) {
          if (err && err.name === "AbortError") throw err;
        }
        if (
          localView &&
          (localView.session_status === "approved" ||
            localView.session_status === "denied" ||
            !view ||
            !view.session_status)
        ) {
          view = localView;
        }
        const st = view && view.session_status;
        if (st === "delivered" || st === "pending" || !st) {
          const where = created && created.home_node ? " · " + created.home_node : "";
          showProgress(
            (st === "delivered" ? "Delivered" : "Waiting") +
              " — approve in the extension or the Android/iOS app" +
              where +
              " · " +
              Math.round((Date.now() - started) / 1000) +
              "s"
          );
          continue;
        }
        if (st === "denied" || st === "expired") {
          throw new Error((view && view.message) || st);
        }
        if (st === "approved") return view;
      }
      throw new DOMException("cancelled", "AbortError");
    }
    async function openSession(password, homeNode, passwordEnc) {
      const body = { branch_peer: origin };
      if (passwordEnc) body.password_enc = passwordEnc;
      else if (password) body.password = password;
      if (homeNode) {
        body.home_node = String(homeNode).replace(/\/+$/, "");
      }
      const res = await fetch("/password-rotation/admin-session", {
        method: "POST",
        headers: { "Content-Type": "application/json", Accept: "application/json" },
        credentials: "include",
        body: JSON.stringify(body),
      });
      let data = {};
      try {
        data = await res.json();
      } catch (e) {
        data = {};
      }
      if (!res.ok || !data.status) {
        throw new Error(
          data.message || ("admin session failed (" + res.status + ")")
        );
      }
      return data;
    }
    function goNext() {
      if (NEXT && NEXT.charAt(0) === "/" && NEXT.charAt(1) !== "/") {
        window.location.assign(NEXT);
        return;
      }
      window.location.assign("/");
    }
    document.getElementById("resyncBtn").onclick = async () => {
      const btn = document.getElementById("resyncBtn");
      startProgress("Contacting the extension to resync…");
      btn.textContent = "Resyncing…";
      try {
        const data = await extRequest("YADA_PASSWORD_RESYNC", "YADA_PASSWORD_RESYNC_RESULT");
        if (!data.ok) throw new Error(data.message || "resync failed");
        stopProgress();
        setMsg(data.message || "Resynced to the node tip. Click Sign in.", "ok");
      } catch (e) {
        stopProgress();
        setMsg(String(e.message || e), "err");
      } finally {
        btn.textContent = RESYNC_LABEL;
      }
    };
    document.getElementById("registerBtn").onclick = async () => {
      const btn = document.getElementById("registerBtn");
      startProgress("Contacting the extension to register this origin…");
      btn.textContent = "Registering…";
      try {
        const data = await extRequest("YADA_PASSWORD_REGISTER", "YADA_PASSWORD_REGISTER_RESULT");
        if (!data.ok) throw new Error(data.message || "register failed");
        stopProgress();
        setMsg("Registered this origin. Click Sign in.", "ok");
      } catch (e) {
        stopProgress();
        setMsg(String(e.message || e), "err");
      } finally {
        btn.textContent = REGISTER_LABEL;
      }
    };
    document.getElementById("signinBtn").onclick = async () => {
      if (working && signinAbort) {
        signinAbort.abort();
        return;
      }
      const username = currentUsername();
      if (!username) {
        setMsg("Enter your Yada username.", "err");
        if ($user) $user.focus();
        return;
      }
      rememberUsername(username);
      signinAbort = new AbortController();
      const signal = signinAbort.signal;
      const btn = document.getElementById("signinBtn");
      startProgress("Creating sign-in request…");
      btn.textContent = "Cancel";
      try {
        const expectedHash = await expectedSigninHash(signal);
        const createRes = await fetch("/password-rotation/auth-session", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Accept: "application/json",
          },
          credentials: "include",
          body: JSON.stringify({
            username: username,
            site: origin,
            action: "operator",
            expectedHash: expectedHash,
          }),
          signal: signal,
        });
        const created = await createRes.json().catch(() => ({}));
        if (!createRes.ok || !created.status || !created.session_id) {
          throw new Error(created.message || "failed to create sign-in request");
        }
        const home = created.home_node ? " · " + created.home_node : "";
        showProgress(
          (created.delivered
            ? "Delivered to Yada Password"
            : "Open Yada Password (extension or Android/iOS app)") +
            " and Approve" +
            home
        );
        const view = await waitForAuthApproval(created.session_id, created, signal);
        if (!view.ok && !view.operator_session) {
          throw new Error(view.message || "sign-in was not approved");
        }
        showProgress("Approved — opening operator session…");
        const session = await openSession(
          "",
          view.home_node || created.home_node || "",
          ""
        );
        stashOperatorToken((session && session.token) || view.token);
        stopProgress();
        setMsg("Session opened — continuing…", "ok");
        goNext();
      } catch (e) {
        const aborted =
          (e && e.name === "AbortError") ||
          String((e && e.message) || e) === "cancelled";
        stopProgress();
        if (!aborted) setMsg(String(e.message || e), "err");
        else setMsg("Cancelled", "err");
      } finally {
        signinAbort = null;
        btn.textContent = SIGNIN_LABEL;
      }
    };
    if ($user) {
      $user.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          document.getElementById("signinBtn").click();
        }
      });
    }
    loadUsername();
  </script>
</body>
</html>
