<section class="panel">
    <div class="panel-head">
        <div>
            <h2>Getting started</h2>
            <p id="pool-url">Loading connection details</p>
        </div>
    </div>
    <div class="stats">
        <div>
            <span>Port</span>
            <strong id="pool-port">—</strong>
        </div>
        <div>
            <span>Difficulty</span>
            <strong id="pool-diff">—</strong>
        </div>
        <div>
            <span>Algorithm</span>
            <strong id="pool-algorithm">—</strong>
        </div>
    </div>
    <h3>Config</h3>
    <div class="search">
        <select id="miner-software" aria-label="Miner software">
            <option value="">Miner software</option>
        </select>
    </div>
    <div class="search">
        <input type="text" id="wallet-address" placeholder="Wallet address">
        <input type="text" id="worker-id" placeholder="Worker ID (optional)">
        <button id="generate-config" class="btn" type="button">Generate</button>
    </div>
    <pre id="config-result" hidden></pre>
    <h3 style="margin-top:18px">Miners</h3>
    <p><a href="https://github.com/xmrig/xmrig/releases" target="_blank" rel="noreferrer">XMRig</a> — RandomX CPU/GPU miner.</p>
    <p><a href="https://github.com/Bendr0id/xmrigCC/releases" target="_blank" rel="noreferrer">XMRigCC</a> — XMRig with remote control.</p>
    <p><a href="https://github.com/doktor83/SRBMiner-Multi/releases" target="_blank" rel="noreferrer">SRBMiner-MULTI</a> — AMD, NVIDIA, Intel, and CPU.</p>
</section>
