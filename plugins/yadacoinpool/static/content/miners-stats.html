<section class="panel">
    <div class="panel-head">
        <div>
            <h2>Miner statistics</h2>
            <p>Workers and payouts for one address</p>
        </div>
    </div>
    <form class="search" onsubmit="loadMinerStatsData(); return false;">
        <input type="text" id="miner-address" placeholder="Wallet address" aria-label="Miner address">
        <button class="btn" type="submit">Get stats</button>
    </form>
    <div class="note" id="miner-address-display" style="display:none">
        Viewing <b id="miner-address-text" class="mono"></b>
    </div>
    <h3>Hashrate</h3>
    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Worker</th>
                    <th class="right">Hashrate</th>
                    <th>Last share</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="miner-stats-table-body">
                <tr><td colspan="4" class="muted">Enter an address</td></tr>
            </tbody>
        </table>
    </div>
    <h3 style="margin-top:18px">Payout history</h3>
    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Time sent</th>
                    <th>Transaction</th>
                    <th class="right">Amount</th>
                    <th>For block</th>
                    <th>In block</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="miner-payouts-table-body">
                <tr><td colspan="6" class="muted">Enter an address</td></tr>
            </tbody>
        </table>
    </div>
    <div id="payout-pagination" class="search" style="margin-top:12px"></div>
</section>
