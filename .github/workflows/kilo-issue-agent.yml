# Kilo issue agent — maintainer-only.
#
# Who can trigger: repo write/maintain/admin, or logins in vars.KILO_MAINTAINERS.
# Comment jobs also require author_association OWNER|MEMBER|COLLABORATOR.
#
# Commands (maintainers only):
#   /triage or label ai-triage     → clarifying comment
#   /implement or label ai-implement → code + draft PR
#   /kilo or /kc                   → ad-hoc agent
#
# Setup:
# 1. Secret KILO_API_KEY (required), KILO_ORG_ID (optional)
# 2. Optional vars: KILO_MODEL, KILO_GATEWAY_MODEL, KILO_MAINTAINERS (comma logins)

name: kilo-issue-agent

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: kilo-issue-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  KILO_MODEL: ${{ vars.KILO_MODEL || 'kilo/x-ai/grok-4.5' }}
  KILO_GATEWAY_MODEL: ${{ vars.KILO_GATEWAY_MODEL || 'x-ai/grok-4.5' }}

jobs:
  triage:
    name: Clarify issue
    if: |
      (github.event_name == 'issues' &&
        github.event.action == 'labeled' &&
        github.event.label.name == 'ai-triage') ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request == null &&
        (contains(github.event.comment.body, '/triage') ||
         startsWith(github.event.comment.body, '/triage')) &&
        (github.event.comment.author_association == 'OWNER' ||
         github.event.comment.author_association == 'MEMBER' ||
         github.event.comment.author_association == 'COLLABORATOR'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require maintainer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          ALLOWLIST: ${{ vars.KILO_MAINTAINERS }}
        run: |
          set -euo pipefail
          if [ -n "${ALLOWLIST:-}" ]; then
            if echo "$ALLOWLIST" | tr ', ' '\n' | grep -Fxq "$ACTOR"; then
              echo "Allowlisted maintainer: $ACTOR"
              exit 0
            fi
          fi
          PERM=$(gh api "repos/${GH_REPO}/collaborators/${ACTOR}/permission" --jq .permission 2>/dev/null || echo none)
          case "$PERM" in
            admin|maintain|write)
              echo "Maintainer permission: $PERM ($ACTOR)"
              ;;
            *)
              echo "::error::Refusing AI triage: $ACTOR is not a maintainer (permission=$PERM)"
              exit 1
              ;;
          esac

      - name: Triage via Kilo Gateway
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
          KILO_ORG_ID: ${{ secrets.KILO_ORG_ID }}
          MODEL: ${{ env.KILO_GATEWAY_MODEL }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if [ -z "${KILO_API_KEY:-}" ]; then
            echo "KILO_API_KEY secret is missing"
            exit 1
          fi

          ISSUE_JSON=$(gh issue view "$ISSUE_NUMBER" --json title,body,author,labels,comments)
          TITLE=$(echo "$ISSUE_JSON" | jq -r .title)
          BODY=$(echo "$ISSUE_JSON" | jq -r '.body // ""')
          COMMENTS=$(echo "$ISSUE_JSON" | jq -r '
            [.comments[]? | "- @" + .author.login + ": " + .body] | join("\n\n")
          ')

          SYSTEM=$'You triage GitHub issues for the YadaCoin monorepo before any code is written.\n\nProject defaults (NEVER ask about these):\n- Repo: this repository only (yadacoin monorepo)\n- Branch: master / default branch, latest code\n- Version: current tip of default branch unless the issue names another tag/commit\n- Stack: Python node, pool, plugins, and related clients in this repo\n\nRules:\n- Reply with plain markdown only (no tool calls).\n- Be brief. Do not restate the issue at length.\n- Do NOT ask about repo, branch, commit, monorepo layout, or "which project" unless the issue clearly spans an external system.\n- Do NOT ask for information already present in the issue body or comments.\n- Ask at most 3 short questions, and only if they truly block a safe fix (missing repro, missing failure signal, missing done definition).\n- Prefer one of: concrete error/log, exact failing path, or 1-line acceptance check.\n- If you can implement with reasonable assumptions, start with READY, list assumptions in bullets, and tell them to add ai-implement or /implement. Prefer READY over grilling when the bug class is clear.\n- If blocked: at most 3 numbered questions, then tell them to reply and add ai-implement or /implement.'

          USER_CONTENT=$(jq -n \
            --arg title "$TITLE" \
            --arg body "$BODY" \
            --arg comments "$COMMENTS" \
            --arg n "$ISSUE_NUMBER" \
            '"Issue #\($n)\nTitle: \($title)\n\nBody:\n\($body)\n\nComments:\n\($comments)"')

          HEADERS=(-H "Authorization: Bearer ${KILO_API_KEY}" -H "Content-Type: application/json")
          if [ -n "${KILO_ORG_ID:-}" ]; then
            HEADERS+=(-H "X-KiloCode-OrganizationId: ${KILO_ORG_ID}")
          fi

          PAYLOAD=$(jq -n \
            --arg model "$MODEL" \
            --arg system "$SYSTEM" \
            --arg user "$USER_CONTENT" \
            '{
              model: $model,
              temperature: 0.2,
              max_tokens: 1200,
              messages: [
                {role: "system", content: $system},
                {role: "user", content: $user}
              ]
            }')

          RESP=$(curl -sS --fail-with-body \
            "${HEADERS[@]}" \
            -d "$PAYLOAD" \
            "https://api.kilo.ai/api/gateway/chat/completions")

          REPLY=$(echo "$RESP" | jq -r '.choices[0].message.content // empty')
          if [ -z "$REPLY" ]; then
            echo "Empty model response:"
            echo "$RESP" | jq . || echo "$RESP"
            exit 1
          fi

          {
            echo "## Kilo triage"
            echo
            echo "$REPLY"
            echo
            echo "---"
            echo "_Maintainer-only. Comment \`/triage\` to re-run, or \`/implement\` / label \`ai-implement\` when ready._"
          } > /tmp/triage.md

          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/triage.md

  implement:
    name: Implement + draft PR
    if: |
      (github.event_name == 'issues' &&
        github.event.action == 'labeled' &&
        github.event.label.name == 'ai-implement') ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request == null &&
        (contains(github.event.comment.body, '/implement') ||
         startsWith(github.event.comment.body, '/implement')) &&
        (github.event.comment.author_association == 'OWNER' ||
         github.event.comment.author_association == 'MEMBER' ||
         github.event.comment.author_association == 'COLLABORATOR'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require maintainer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          ALLOWLIST: ${{ vars.KILO_MAINTAINERS }}
        run: |
          set -euo pipefail
          if [ -n "${ALLOWLIST:-}" ]; then
            if echo "$ALLOWLIST" | tr ', ' '\n' | grep -Fxq "$ACTOR"; then
              echo "Allowlisted maintainer: $ACTOR"
              exit 0
            fi
          fi
          PERM=$(gh api "repos/${GH_REPO}/collaborators/${ACTOR}/permission" --jq .permission 2>/dev/null || echo none)
          case "$PERM" in
            admin|maintain|write)
              echo "Maintainer permission: $PERM ($ACTOR)"
              ;;
            *)
              echo "::error::Refusing AI implement: $ACTOR is not a maintainer (permission=$PERM)"
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Configure Kilo CI permissions
        run: |
          mkdir -p "$HOME/.config/kilo" .kilo
          cat > "$HOME/.config/kilo/kilo.json" <<'EOF'
          {
            "$schema": "https://app.kilo.ai/config.json",
            "permission": {
              "*": "allow",
              "question": "deny",
              "suggest": "deny"
            }
          }
          EOF
          cp "$HOME/.config/kilo/kilo.json" .kilo/kilo.json

      - name: Run Kilo implement
        uses: Kilo-Org/kilocode/github@v7.5.16
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: ${{ env.KILO_MODEL }}
          kilo_api_key: ${{ secrets.KILO_API_KEY }}
          kilo_org_id: ${{ secrets.KILO_ORG_ID }}
          use_github_token: "true"
          mentions: /implement
          prompt: |
            Implement a fix/feature for this GitHub issue.

            Requirements:
            - Use the full issue thread (title, body, and all comments) as the spec.
            - Prefer answers from the author over guesses; state assumptions if still needed.
            - Make minimal, focused code changes that match existing project style.
            - Do not commit secrets or credentials.
            - Tool use is pre-approved in CI; do not wait for human approval.
            - Create a new branch, commit your changes, and open a DRAFT pull request
              (gh pr create --draft).
            - PR body must include summary, test plan, and `Closes #<issue-number>`.
            - Do NOT merge the PR.
            - Configure git if needed as github-actions[bot].

  adhoc:
    name: Ad-hoc /kilo
    if: |
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') && (
        contains(github.event.comment.body, '/kilo') ||
        contains(github.event.comment.body, '/kc') ||
        startsWith(github.event.comment.body, '/kilo') ||
        startsWith(github.event.comment.body, '/kc')
      ) && !contains(github.event.comment.body, '/implement')
        && !contains(github.event.comment.body, '/triage')
        && (github.event.comment.author_association == 'OWNER' ||
            github.event.comment.author_association == 'MEMBER' ||
            github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require maintainer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          ALLOWLIST: ${{ vars.KILO_MAINTAINERS }}
        run: |
          set -euo pipefail
          if [ -n "${ALLOWLIST:-}" ]; then
            if echo "$ALLOWLIST" | tr ', ' '\n' | grep -Fxq "$ACTOR"; then
              echo "Allowlisted maintainer: $ACTOR"
              exit 0
            fi
          fi
          PERM=$(gh api "repos/${GH_REPO}/collaborators/${ACTOR}/permission" --jq .permission 2>/dev/null || echo none)
          case "$PERM" in
            admin|maintain|write)
              echo "Maintainer permission: $PERM ($ACTOR)"
              ;;
            *)
              echo "::error::Refusing AI adhoc: $ACTOR is not a maintainer (permission=$PERM)"
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Configure Kilo CI permissions
        run: |
          mkdir -p "$HOME/.config/kilo" .kilo
          cat > "$HOME/.config/kilo/kilo.json" <<'EOF'
          {
            "$schema": "https://app.kilo.ai/config.json",
            "permission": {
              "*": "allow",
              "question": "deny",
              "suggest": "deny"
            }
          }
          EOF
          cp "$HOME/.config/kilo/kilo.json" .kilo/kilo.json

      - name: Run Kilo
        uses: Kilo-Org/kilocode/github@v7.5.16
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: ${{ env.KILO_MODEL }}
          kilo_api_key: ${{ secrets.KILO_API_KEY }}
          kilo_org_id: ${{ secrets.KILO_ORG_ID }}
          use_github_token: "true"
          mentions: /kilo,/kc
