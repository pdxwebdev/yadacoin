name: Copy client release secrets
on:
  workflow_dispatch:
permissions: {}
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Copy to standalone client repo
        env:
          GH_TOKEN: ${{ secrets.SECRET_SYNC_TOKEN }}
          TARGET: pdxwebdev/yadacoin-password-manager
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_JSON: ${{ secrets.CHROME_SERVICE_ACCOUNT_JSON }}
          PASSWORD_ANDROID_KEYSTORE_BASE64: ${{ secrets.PASSWORD_ANDROID_KEYSTORE_BASE64 }}
          PASSWORD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PASSWORD_ANDROID_KEYSTORE_PASSWORD }}
          PASSWORD_ANDROID_KEY_ALIAS: ${{ secrets.PASSWORD_ANDROID_KEY_ALIAS }}
          PASSWORD_ANDROID_KEY_PASSWORD: ${{ secrets.PASSWORD_ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          for name in CHROME_EXTENSION_ID CHROME_PUBLISHER_ID CHROME_SERVICE_ACCOUNT_JSON \
            PASSWORD_ANDROID_KEYSTORE_BASE64 PASSWORD_ANDROID_KEYSTORE_PASSWORD \
            PASSWORD_ANDROID_KEY_ALIAS PASSWORD_ANDROID_KEY_PASSWORD PLAY_SERVICE_ACCOUNT_JSON; do
            value="${!name-}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | gh secret set "$name" --repo "$TARGET"
              echo "copied $name"
            else
              echo "skipped $name (empty)"
            fi
          done
