name: Test and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-changes:
    name: Detect what changed
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.diff.outputs.code_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes vs previous tag
        id: diff
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | grep '^v' | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found — treating everything as changed"
            echo "code_changed=true" >> $GITHUB_OUTPUT
          else
            echo "Comparing $PREV_TAG → ${{ github.ref_name }}"

            CODE=$(git diff --name-only "$PREV_TAG" "${{ github.ref_name }}" -- yadacoin/ tests/)
            if [ -n "$CODE" ]; then
              echo "code_changed=true" >> $GITHUB_OUTPUT
            else
              echo "No code changes — skipping tests"
              echo "code_changed=false" >> $GITHUB_OUTPUT
            fi
          fi

  test:
    name: Run tests
    needs: check-changes
    if: needs.check-changes.outputs.code_changed == 'true'
    runs-on: ubuntu-22.04
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==8.1.2 mongomock pytest-cov

      - name: Run unit tests with pytest
        run: pytest tests/unittests/core --cov=yadacoin.core --cov-config=.coveragerc --cov-report=term-missing --cov-fail-under=100

  image:
    name: Build image (${{ matrix.arch }})
    needs: [check-changes, test]
    if: |
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error

  release:
    name: Publish image manifest and release
    needs: image
    if: always() && needs.image.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.name }}
    steps:
      - name: Set tag name
        id: tag
        run: echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        working-directory: /tmp/digests
        run: |
          image="ghcr.io/${{ github.repository }}"
          args=""
          for digest in *; do
            args="$args $image@sha256:$digest"
          done
          docker buildx imagetools create -t "$image:${{ steps.tag.outputs.name }}" -t "$image:latest" $args

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: YadaCoin ${{ steps.tag.outputs.name }}
          body: |
            Release ${{ steps.tag.outputs.name }}

            See [CHANGELOG](https://github.com/${{ github.repository }}/commits/${{ steps.tag.outputs.name }}) for changes.
          draft: false
          prerelease: false

  windows:
    name: Build and release Windows
    needs: release
    if: always() && needs.release.result == 'success'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install 7-Zip
        run: choco install 7zip -y

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v cmake >/dev/null 2>&1; then
            choco install cmake -y
          fi
          cmake --version
          grep -vE "pyrx" requirements.txt > filtered_requirements.txt
          python -m pip install --upgrade pip
          python -m pip install -r filtered_requirements.txt
          python -m pip install pybind11 "pyinstaller==5.13.2" pytest==7.4.4
          python -m pip install --no-build-isolation "git+https://github.com/pdxwebdev/pyrx"
          python -m pip install "setuptools<82"
          python -c "import pyrx, pathlib; print(pathlib.Path(pyrx.__file__).resolve())" > pyrx_pyd_path.txt

      - name: Build with PyInstaller
        run: pyinstaller yadacoin/app.spec

      - name: Zip the contents of dist directory
        run: |
          cd dist
          7z a ../yadacoin-windows.zip ./*

      - name: Add additional file to the zip
        run: |
          New-Item -ItemType Directory -Force -Path YadaCoin | Out-Null
          Copy-Item (Get-Content -Raw pyrx_pyd_path.txt).Trim() YadaCoin/
          move VERSION YadaCoin/
          move MIN_VERSION YadaCoin/
          7z u yadacoin-windows.zip ./YadaCoin/
          rm -r YadaCoin/

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: yadacoin-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos-sign-check:
    name: Check macOS signing secrets
    needs: release
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      sign: ${{ steps.gate.outputs.sign }}
    steps:
      - name: Decide whether to build the signed DMG
        id: gate
        env:
          MACOS_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_BASE64 }}
          MACOS_APPLICATION_CERTIFICATE_BASE64: ${{ secrets.MACOS_APPLICATION_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -eu
          missing=0
          present=0
          for name in \
            MACOS_INSTALLER_CERTIFICATE_BASE64 \
            MACOS_APPLICATION_CERTIFICATE_BASE64 \
            MACOS_CERTIFICATE_PASSWORD \
            KEYCHAIN_PASSWORD \
            APPLE_TEAM_ID \
            APP_STORE_CONNECT_API_KEY \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID
          do
            if [ -n "${!name}" ]; then
              present=$((present + 1))
            else
              missing=$((missing + 1))
            fi
          done
          if [ "$present" -eq 0 ]; then
            echo "Signing secrets are not set. Skipping the macOS installer."
            echo "sign=false" >> "$GITHUB_OUTPUT"
          elif [ "$missing" -ne 0 ]; then
            echo "Some macOS signing secrets are set and some are missing."
            exit 1
          else
            echo "sign=true" >> "$GITHUB_OUTPUT"
          fi

  macos:
    name: Build and release macOS
    needs: [release, macos-sign-check]
    if: always() && needs.release.result == 'success' && needs.macos-sign-check.result == 'success' && needs.macos-sign-check.outputs.sign == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Build package
        run: bash packaging/macos/build-dmg.sh "$GITHUB_WORKSPACE/yadacoin-node.pkg"

      - name: Sign, notarize, and wrap DMG
        env:
          MACOS_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_BASE64 }}
          MACOS_APPLICATION_CERTIFICATE_BASE64: ${{ secrets.MACOS_APPLICATION_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: bash packaging/macos/sign-and-notarize.sh "$GITHUB_WORKSPACE/yadacoin-node.pkg" "$GITHUB_WORKSPACE/yadacoin-macos.dmg"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: yadacoin-macos.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
