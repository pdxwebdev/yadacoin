name: Password manager store release

# Tag: password-vX.Y.Z
# Secrets:
#   Chrome: CHROME_EXTENSION_ID, CHROME_CLIENT_ID, CHROME_CLIENT_SECRET, CHROME_REFRESH_TOKEN
#   iOS: BUILD_CERTIFICATE_BASE64, P12_PASSWORD, KEYCHAIN_PASSWORD, APPLE_TEAM_ID
#        PASSWORD_BUILD_PROVISION_PROFILE_BASE64, PASSWORD_PROVISIONING_PROFILE_NAME
#        APP_STORE_CONNECT_API_KEY, APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID
#        (fallback: APP_STORE_CONNECT_USERNAME, APP_STORE_CONNECT_PASSWORD)
#   Android: PASSWORD_ANDROID_KEYSTORE_BASE64, PASSWORD_ANDROID_KEYSTORE_PASSWORD,
#            PASSWORD_ANDROID_KEY_ALIAS, PASSWORD_ANDROID_KEY_PASSWORD
#            PLAY_SERVICE_ACCOUNT_JSON

on:
  push:
    tags:
      - "password-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "password-vX.Y.Z tag to build"
        required: true
        type: string
      play_track:
        description: "Play Console track"
        required: false
        default: internal
        type: string

concurrency:
  group: password-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      version_code: ${{ steps.parse.outputs.version_code }}
      tag: ${{ steps.parse.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: parse
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          .github/scripts/parse-client-tag.sh "$TAG" | tee /tmp/parse.out
          PRODUCT=$(awk -F= '/^product=/{print $2}' /tmp/parse.out)
          if [ "$PRODUCT" != "password" ]; then
            echo "Expected password-vX.Y.Z, got $TAG" >&2
            exit 1
          fi
          cat /tmp/parse.out >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  extension:
    needs: version
    runs-on: ubuntu-latest
    env:
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
      CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
      CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
    defaults:
      run:
        working-directory: clients/password-manager
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: clients/password-manager/package-lock.json
      - name: Build and zip
        env:
          EXTENSION_VERSION: ${{ needs.version.outputs.version }}
        run: |
          npm ci
          npm run package:extension
      - uses: actions/upload-artifact@v4
        with:
          name: yada-password-extension
          path: clients/password-manager/apps/extension/yada-password-extension.zip
      - name: Upload and publish to Chrome Web Store
        if: env.CHROME_REFRESH_TOKEN != '' && env.CHROME_EXTENSION_ID != ''
        run: |
          npx chrome-webstore-upload-cli@3 upload \
            --source apps/extension/yada-password-extension.zip \
            --extension-id "$CHROME_EXTENSION_ID" \
            --client-id "$CHROME_CLIENT_ID" \
            --client-secret "$CHROME_CLIENT_SECRET" \
            --refresh-token "$CHROME_REFRESH_TOKEN"
          npx chrome-webstore-upload-cli@3 publish \
            --extension-id "$CHROME_EXTENSION_ID" \
            --client-id "$CHROME_CLIENT_ID" \
            --client-secret "$CHROME_CLIENT_SECRET" \
            --refresh-token "$CHROME_REFRESH_TOKEN"
      - name: Skip Chrome notice
        if: env.CHROME_REFRESH_TOKEN == '' || env.CHROME_EXTENSION_ID == ''
        run: echo "Skipping Chrome Web Store upload (CHROME_REFRESH_TOKEN / CHROME_EXTENSION_ID not set)"

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      PASSWORD_ANDROID_KEYSTORE_BASE64: ${{ secrets.PASSWORD_ANDROID_KEYSTORE_BASE64 }}
      PASSWORD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PASSWORD_ANDROID_KEYSTORE_PASSWORD }}
      PASSWORD_ANDROID_KEY_ALIAS: ${{ secrets.PASSWORD_ANDROID_KEY_ALIAS }}
      PASSWORD_ANDROID_KEY_PASSWORD: ${{ secrets.PASSWORD_ANDROID_KEY_PASSWORD }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: clients/password-manager/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install and build JS
        working-directory: clients/password-manager
        run: |
          npm ci
          npm run build -w @yadacoin/password-core
          npm run build -w @yadacoin/password-shared-ui
          npm run build:password-native
      - name: Capacitor sync
        working-directory: clients/password-manager/apps/password-native
        run: npx cap sync android
      - name: Decode keystore
        if: env.PASSWORD_ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ env.PASSWORD_ANDROID_KEYSTORE_BASE64 }}
        run: |
          KS="$RUNNER_TEMP/password-release.jks"
          ANDROID_KEYSTORE_BASE64="$ANDROID_KEYSTORE_BASE64" bash "$GITHUB_WORKSPACE/.github/scripts/decode-keystore.sh" "$KS"
          echo "ANDROID_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
      - name: Bundle release AAB
        working-directory: clients/password-manager/apps/password-native/android
        env:
          ANDROID_VERSION_NAME: ${{ needs.version.outputs.version }}
          ANDROID_VERSION_CODE: ${{ needs.version.outputs.version_code }}
          ANDROID_KEYSTORE_PASSWORD: ${{ env.PASSWORD_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ env.PASSWORD_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ env.PASSWORD_ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: password-android-aab
          path: clients/password-manager/apps/password-native/android/app/build/outputs/bundle/release/*.aab
      - name: Upload to Play Console
        if: env.PLAY_SERVICE_ACCOUNT_JSON != '' && env.PASSWORD_ANDROID_KEYSTORE_BASE64 != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.yadacoin.passwordrotation
          releaseFiles: clients/password-manager/apps/password-native/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.play_track || 'internal' }}
          status: draft

  ios:
    needs: version
    runs-on: macos-latest
    env:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      PASSWORD_BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.PASSWORD_BUILD_PROVISION_PROFILE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      PASSWORD_PROVISIONING_PROFILE_NAME: ${{ secrets.PASSWORD_PROVISIONING_PROFILE_NAME }}
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_USERNAME: ${{ secrets.APP_STORE_CONNECT_USERNAME }}
      APP_STORE_CONNECT_PASSWORD: ${{ secrets.APP_STORE_CONNECT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: clients/password-manager/package-lock.json
      - name: Install and build JS
        working-directory: clients/password-manager
        run: |
          npm ci
          npm run build -w @yadacoin/password-core
          npm run build -w @yadacoin/password-shared-ui
          npm run build:password-native
      - name: Capacitor sync
        working-directory: clients/password-manager/apps/password-native
        run: npx cap sync ios
      - name: CocoaPods
        working-directory: clients/password-manager/apps/password-native/ios/App
        run: pod install
      - name: Import signing
        if: env.BUILD_CERTIFICATE_BASE64 != '' && env.PASSWORD_BUILD_PROVISION_PROFILE_BASE64 != ''
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ env.PASSWORD_BUILD_PROVISION_PROFILE_BASE64 }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/ios-import-signing.sh"
      - name: Archive
        if: env.BUILD_CERTIFICATE_BASE64 != '' && env.PASSWORD_BUILD_PROVISION_PROFILE_BASE64 != ''
        working-directory: clients/password-manager/apps/password-native/ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            archive \
            MARKETING_VERSION="${{ needs.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ needs.version.outputs.version_code }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PASSWORD_PROVISIONING_PROFILE_NAME"
      - name: Export IPA
        if: env.BUILD_CERTIFICATE_BASE64 != '' && env.PASSWORD_BUILD_PROVISION_PROFILE_BASE64 != ''
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/ios-write-export-options.sh" \
            "$RUNNER_TEMP/ExportOptions.plist" \
            "$APPLE_TEAM_ID" \
            "io.yadacoin.passwordrotation" \
            "$PASSWORD_PROVISIONING_PROFILE_NAME"
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
      - uses: actions/upload-artifact@v4
        if: env.BUILD_CERTIFICATE_BASE64 != '' && env.PASSWORD_BUILD_PROVISION_PROFILE_BASE64 != ''
        with:
          name: password-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
      - name: Upload to App Store Connect
        if: env.BUILD_CERTIFICATE_BASE64 != '' && env.PASSWORD_BUILD_PROVISION_PROFILE_BASE64 != ''
        run: |
          IPA=$(ls "$RUNNER_TEMP/export"/*.ipa | head -1)
          bash "$GITHUB_WORKSPACE/.github/scripts/ios-upload-ipa.sh" "$IPA"
      - name: Clean signing
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
      - name: Skip iOS notice
        if: env.BUILD_CERTIFICATE_BASE64 == '' || env.PASSWORD_BUILD_PROVISION_PROFILE_BASE64 == ''
        run: echo "Skipping iOS archive (signing secrets not set)"

  github-release:
    needs: [version, extension, android, ios]
    if: always() && needs.version.result == 'success' && needs.extension.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Yada Password ${{ needs.version.outputs.version }}
          body: |
            Yada Password ${{ needs.version.outputs.version }} (build ${{ needs.version.outputs.version_code }})

            Chrome zip, Play internal (draft), and App Store Connect upload run when the matching secrets are configured.
          files: artifacts/**/*
          fail_on_unmatched_files: false
