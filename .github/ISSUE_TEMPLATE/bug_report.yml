name: Bug report
description: Something is broken or behaves incorrectly
title: "[bug] "
labels: ["bug", "ai-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Fill every required field. Incomplete reports will get clarifying questions before any code is written.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing the problem.
      placeholder: e.g. Node fails to start after upgrading to vX with Mongo auth enabled.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What happens instead? Include error messages.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps someone else can follow.
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python/Node versions, deployment type, relevant config (redact secrets).
      placeholder: |
        - OS:
        - YadaCoin version / commit:
        - Python:
        - Mongo:
        - How run (docker / bare metal / pool / masternode):
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / stack traces
      description: Paste relevant logs. Redact keys, passwords, seeds.
      render: shell
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Blocker (outage / funds / security)
        - High (major feature broken)
        - Medium (workaround exists)
        - Low (cosmetic / minor)
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How we know this is fixed. Be specific and testable.
      placeholder: |
        - [ ] …
        - [ ] …
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate
          required: true
        - label: I redacted secrets from logs and config
          required: true
